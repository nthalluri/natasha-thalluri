name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install dependencies
        run: |
          bundle config set frozen false
          bundle install

      - name: Build site
        run: |
    bundle exec jekyll build
    echo "===== GENERATED CSS ====="
    cat _site/assets/css/main.css
  env:
    JEKYLL_ENV: production
